services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yrest_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-yrest_demo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./db/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/002_demo_seed.sql:ro
      - ./db/seeds/counterparties.csv:/docker-entrypoint-initdb.d/counterparties.csv:ro

  yrestapi:
    build:
      context: ../YrestAPI
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-yrest_demo}?sslmode=disable}
      MODELS_DIR: /app/models
      LOCALE: ${LOCALE:-en}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://127.0.0.1:5500}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./models:/app/models:ro

volumes:
  postgres_data:
