<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YrestAPI Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell" id="page-shell">
      <header class="hero">
        <div class="hero-main">
          <nav class="hero-breadcrumbs" aria-label="Breadcrumb">
            <span>YrestAPI Demo</span>
            <span class="hero-breadcrumb-sep">›</span>
            <span>Documents</span>
          </nav>
          <div class="hero-copy-block">
            <h1>Primary accounting documents</h1>
            <p class="hero-copy">
              A compact registry and a structured detail view for heterogeneous accounting documents.
            </p>
          </div>
          <div class="hero-stats" id="hero-stats"></div>
        </div>
        <div class="hero-actions">
          <button class="hero-action ghost" type="button">Registry</button>
          <button class="hero-action primary" type="button">Detail View</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar panel">
          <div class="panel-head">
            <div>
              <p class="panel-kicker">Documents</p>
              <h2>Registry</h2>
            </div>
            <span class="mono" id="document-count"></span>
          </div>

          <div class="controls">
            <label class="field">
              <div class="field-control">
                <span class="field-addon">Search</span>
                <input id="search-input" type="search" placeholder="Number, counterparty, tax id..." />
              </div>
            </label>

            <label class="field">
              <div class="field-control">
                <span class="field-addon">Filter</span>
                <select id="type-filter"></select>
              </div>
            </label>
          </div>

          <div class="document-list-shell">
            <div class="document-list" id="document-list"></div>
          </div>
        </aside>

        <section class="details panel">
          <div class="document-details-root" id="document-details"></div>
        </section>
      </main>
    </div>

    <script src="./yrest-client.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
